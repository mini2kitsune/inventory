async function saveVendorEdit() {
  const id = document.getElementById('editVendorId').value;
  const name = document.getElementById('vendorName').value.trim();
  const shortName = document.getElementById('vendorShortName').value.trim() || (name.length > 5 ? name.substring(0, 5) : name);
  const leadTimeDays = parseInt(document.getElementById('vendorLeadTime').value) || 7;

  if (!name) { showToast('仕入先名を入力してください'); return; }

  if (!id) {
    // Add mode
    if (DATA.vendors.find(v => v.name === name)) { showToast('同じ名前の仕入先があります'); return; }
    const maxSort = Math.max(0, ...DATA.vendors.map(v => v.sortOrder || 0));
    const sortOrder = maxSort + 1;
    let newId = uid();
    DATA.vendors.push({ id: newId, name, shortName, sortOrder, leadTimeDays });
    saveData(DATA);
    closeModal('editVendor');
    renderSettingsVendors();
    render();
    if (!sbClient || !isOnline) {
      enqueueSync({ type: 'add_vendor', name, shortName, sortOrder, leadTimeDays, tempId: newId });
      showToast('追加しました');
      return;
    }
    try {
      const { data, error } = await sbClient.from('vendors').insert({
        tenant_id: TENANT_ID, name, short_name: shortName, sort_order: sortOrder, is_active: true, lead_time_days: leadTimeDays,
      }).select('id').single();
      if (error) throw error;
      const lv = DATA.vendors.find(v => v.id === newId);
      if (lv) lv.id = data.id;
      DATA.products.forEach(p => { if (p.vendorId === newId) p.vendorId = data.id; });
      saveData(DATA);
      showToast('追加しました');
      lastSyncTime = new Date(); updateSyncDisplay();
    } catch(e) {
      console.error('addVendor失敗:', e);
      enqueueSync({ type: 'add_vendor', name, shortName, sortOrder, leadTimeDays, tempId: newId });
      showToast('⚠ サーバー保存に失敗（端末には保存済み）');
    }
  } else {
    // Edit mode
    const v = DATA.vendors.find(x => x.id === id);
    if (!v) return;
    if (name !== v.name && DATA.vendors.find(x => x.id !== id && x.name === name)) {
      showToast('同じ名前の仕入先があります'); return;
    }
    v.name = name; v.shortName = shortName; v.leadTimeDays = leadTimeDays;
    saveData(DATA);
    closeModal('editVendor');
    renderSettingsVendors();
    render();
    if (!sbClient || !isOnline) {
      enqueueSync({ type: 'edit_vendor', id, name, shortName, leadTimeDays });
      showToast('保存しました');
      return;
    }
    try {
      const { error } = await sbClient.from('vendors').update({ name, short_name: shortName, lead_time_days: leadTimeDays }).eq('id', id).eq('tenant_id', TENANT_ID);
      if (error) throw error;
      showToast('保存しました');
      lastSyncTime = new Date(); updateSyncDisplay();
    } catch(e) {
      console.error('editVendor失敗:', e);
      enqueueSync({ type: 'edit_vendor', id, name, shortName, leadTimeDays });
      showToast('⚠ サーバー保存に失敗（端末には保存済み）');
    }
  }
}

async function deleteVendor(id) {
  const v = DATA.vendors.find(x => x.id === id);
  if (!v) return;
  const productCount = DATA.products.filter(p => p.vendorId === id && p.active !== false).length;
  const msg = productCount > 0
    ? `「${v.name}」を削除すると、${productCount}件の商品も削除されます。よろしいですか？`
    : `「${v.name}」を削除しますか？`;
  if (!confirm(msg)) return;

  if (sbClient && isOnline) {
    try {
      await sbClient.from('vendors').update({ is_active: false }).eq('id', id).eq('tenant_id', TENANT_ID);
      if (productCount > 0) {
        await sbClient.from('products').update({ is_active: false }).eq('vendor_id', id).eq('tenant_id', TENANT_ID);
      }
    } catch(e) {
      console.error('deleteVendor失敗:', e);
    }
  }

  DATA.vendors = DATA.vendors.filter(x => x.id !== id);
  DATA.products.forEach(p => { if (p.vendorId === id) p.active = false; });
  if (currentVendorId === id) {
    currentVendorId = DATA.vendors[0]?.id || '';
  }
  saveData(DATA);
  showToast('削除しました');
  renderSettingsVendors();
  render();
}

function renderSettingsVendors() {
  const el = document.getElementById('vendorList');
  el.innerHTML = DATA.vendors

function exportData() {
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `inventory_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('エクスポートしました');
}

function importData() {
  document.getElementById('importFile').click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!imported.vendors || !imported.products) {
        showToast('無効なデータです');
        return;
      }
      if (!confirm('現在のデータを上書きしますか？')) return;
      DATA = imported;
      saveData(DATA);
      currentVendorId = DATA.vendors[0]?.id || '';
      showToast('インポートしました');
      render();
      closeModal('settings');
    } catch(err) {
      showToast('ファイルの読み込みに失敗しました');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function confirmClearData() {
  if (!confirm('全データを削除しますか？この操作は元に戻せません。')) return;
  if (!confirm('本当に削除しますか？')) return;
  DATA = getDefaultData();
  saveData(DATA);
  currentVendorId = '';
  orderCart = [];
  pendingChanges = {};
  showToast('全データを削除しました');
  closeModal('settings');
  render();
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// JST固定の YYYY-MM-DD キーを返す（グループ化・比較用。表示はtoLocaleDateString使用）
function toJSTDateKey(date) {
  const d = new Date(date.getTime() + 9 * 60 * 60 * 1000);
  return d.toISOString().slice(0, 10);
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ============================
// UX-1: 棚卸しチェック済みマーカー
// ============================
function toggleStocktakeCheck(productId, e) {
  e.stopPropagation();
  const key = 'stk_' + productId;
  const wasChecked = !!sessionStorage.getItem(key);
  if (wasChecked) {
    sessionStorage.removeItem(key);
  } else {
    sessionStorage.setItem(key, '1');
  }
  const card = document.getElementById('card-' + productId);
  const box = document.getElementById('stkbox-' + productId);
  if (card) card.classList.toggle('stk-checked', !wasChecked);
  if (box) {
    box.innerHTML = !wasChecked
      ? '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7l3 3 7-7" stroke="#51cf66" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>'
      : '';
  }
  // 全チェックボタンのラベルを更新
  const products = DATA.products.filter(p => p.vendorId === currentVendorId && p.active !== false);
  const allChecked = products.every(p => !!sessionStorage.getItem('stk_' + p.id));
  const allBtn = document.querySelector('[onclick="checkAllStocktaking()"]');
  if (allBtn) allBtn.textContent = allChecked ? '全解除' : '全チェック';
}

function checkAllStocktaking() {
  const products = DATA.products.filter(p => p.vendorId === currentVendorId && p.active !== false);
  const allChecked = products.every(p => !!sessionStorage.getItem('stk_' + p.id));
  products.forEach(p => {
    const key = 'stk_' + p.id;
    if (allChecked) {
      sessionStorage.removeItem(key);
    } else {
      sessionStorage.setItem(key, '1');
    }
    const card = document.getElementById('card-' + p.id);
    const box = document.getElementById('stkbox-' + p.id);
    if (card) card.classList.toggle('stk-checked', !allChecked);
    if (box) {
      box.innerHTML = !allChecked
        ? '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7l3 3 7-7" stroke="#51cf66" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>'
        : '';
    }
  });
  const allBtn = document.querySelector('[onclick="checkAllStocktaking()"]');
  if (allBtn) allBtn.textContent = allChecked ? '全チェック' : '全解除';
}


// ============================
// P7: D&D ソート
// ============================
let _dndState = null;

function dndStart(e, pid) {
  e.preventDefault();
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const card = document.getElementById('card-' + pid);
  if (!card) return;
  card.classList.add('dnd-dragging');
  if (navigator.vibrate) navigator.vibrate(25);

  _dndState = { pid, startY: clientY, currentTargetPid: null };

  const onMove = ev => {
    ev.preventDefault();
    if (!_dndState) return;
    const y = ev.touches ? ev.touches[0].clientY : ev.clientY;
    const all = [...document.querySelectorAll('#content .card[data-pid]')];
    let targetEl = null, targetPid = null, isAbove = false;
    for (const c of all) {
      const rect = c.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (c.dataset.pid === pid) continue;
      if (Math.abs(y - mid) < rect.height * 0.6) {
        targetEl = c; targetPid = c.dataset.pid;
        isAbove = y < mid;
        break;
      }
    }
    all.forEach(c => c.classList.remove('dnd-target-above', 'dnd-target-below'));
    if (targetEl) {
      targetEl.classList.add(isAbove ? 'dnd-target-above' : 'dnd-target-below');
      _dndState.currentTargetPid = targetPid;
      _dndState.targetAbove = isAbove;
    } else {
      _dndState.currentTargetPid = null;
    }
  };

  const onEnd = async () => {
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    if (!_dndState) return;
    const { pid: srcPid, currentTargetPid, targetAbove } = _dndState;
    _dndState = null;

    document.querySelectorAll('#content .card[data-pid]').forEach(c =>
      c.classList.remove('dnd-dragging', 'dnd-target-above', 'dnd-target-below')
    );

    if (!currentTargetPid || currentTargetPid === srcPid) return;

    const vendorId = currentVendorId;
    const products = DATA.products
      .filter(p => p.vendorId === vendorId && p.active !== false)
      .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));

    const srcIdx = products.findIndex(p => p.id === srcPid);
    const tgtIdx = products.findIndex(p => p.id === currentTargetPid);
    if (srcIdx < 0 || tgtIdx < 0) return;

    const [moved] = products.splice(srcIdx, 1);
    const insertAt = srcIdx < tgtIdx
      ? (targetAbove ? tgtIdx - 1 : tgtIdx)
      : (targetAbove ? tgtIdx : tgtIdx + 1);
    products.splice(Math.max(0, insertAt), 0, moved);
    products.forEach((p, i) => { p.sortOrder = (i + 1) * 10; });
    saveData(DATA);
    render();
    if (sbClient && isOnline) {
      try {
        await Promise.all(products.map(p =>
          sbClient.from('products').update({ sort_order: p.sortOrder }).eq('id', p.id).eq('tenant_id', TENANT_ID)
        ));
        lastSyncTime = new Date(); updateSyncDisplay();
      } catch(err) { console.error('D&D sort保存失敗:', err); }
    }
  };

  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend', onEnd, { once: true });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd, { once: true });
}

// 五十音順一括整列（P7b）
async function sortAllProductsAiueo() {
  if (!confirm('全仕入先の商品を五十音順に並べ直しますか？現在の並び順は上書きされます。')) return;
  const vendors = DATA.vendors;
  const allUpdated = [];
  vendors.forEach(v => {
    const products = DATA.products
      .filter(p => p.vendorId === v.id && p.active !== false)
      .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    products.forEach((p, i) => { p.sortOrder = (i + 1) * 10; allUpdated.push(p); });
  });
  saveData(DATA);
  render();
  closeModal('settings');
  if (sbClient && isOnline) {
    try {
      await Promise.all(allUpdated.map(p =>
        sbClient.from('products').update({ sort_order: p.sortOrder }).eq('id', p.id).eq('tenant_id', TENANT_ID)
      ));
      showToast(`五十音順に整列しました（${allUpdated.length}件）`);
      lastSyncTime = new Date(); updateSyncDisplay();
    } catch(err) {
      console.error('五十音整列保存失敗:', err);
      showToast('ローカルのみ整列しました');
    }
  } else {
    showToast(`五十音順に整列しました（${allUpdated.length}件）`);
  }
}

function forceUpdate() {
  if (!confirm('最新版に更新します。データは消えません。よろしいですか？')) return;
  if ('caches' in window) {
    caches.keys().then(names => names.forEach(name => caches.delete(name)));
  }
  location.reload();
}

// ============================
// Realtime Subscriptions
// ============================
let realtimeChannel = null;

function setupRealtime() {
  if (!sbClient || !currentUser) return;
  if (realtimeChannel) sbClient.removeChannel(realtimeChannel);
  let reloadTimer = null;
  const scheduleReload = () => {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(() => {
      loadDataFromSupabase().then(() => render());
    }, 800);
  };
  realtimeChannel = sbClient.channel('inventory_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'vendors' }, scheduleReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, scheduleReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, scheduleReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'order_history' }, scheduleReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'stocktaking_history' }, scheduleReload)
    .subscribe();
}

// ============================
// Migration: localStorage → Supabase
// ============================
async function migrateFromLocalStorage() {
  const raw = localStorage.getItem('inventory_app_local_backup') || localStorage.getItem('inventory_app');
  if (!raw) {
    showToast('移行するローカルデータがありません');
    return;
  }
  let localData;
  try { localData = JSON.parse(raw); } catch(e) { showToast('データ読み込み失敗'); return; }
  const activeProducts = (localData.products || []).filter(p => p.active !== false);
  if ((localData.vendors || []).length === 0 && activeProducts.length === 0) {
    showToast('移行するデータがありません');
    return;
  }
  if (!confirm(`仕入先${(localData.vendors||[]).length}件・商品${activeProducts.length}件をSupabaseへ移行します。\n※既にSupabase上にデータがある場合は重複する可能性があります。`)) return;

  closeModal('settings');

  try {
    let done = 0;
    const total = (localData.vendors || []).length + activeProducts.length;

    const vendorMap = {};
    for (const v of (localData.vendors || [])) {
      const { data, error } = await sbClient.from('vendors').insert({
        tenant_id: TENANT_ID, name: v.name, short_name: v.shortName || null,
        sort_order: v.sortOrder || 0, is_active: true,
      }).select('id').single();
      if (!error && data) {
        vendorMap[v.id] = data.id;
      } else {
        const { data: ex } = await sbClient.from('vendors').select('id')
          .eq('tenant_id', TENANT_ID).eq('name', v.name).maybeSingle();
        if (ex) vendorMap[v.id] = ex.id;
      }
      done++;
      showToast(`移行中...${done}/${total}件`);
    }

    for (const p of activeProducts) {
      const { data: pd, error: pe } = await sbClient.from('products').insert({
        tenant_id: TENANT_ID,
        vendor_id: vendorMap[p.vendorId] || p.vendorId,
        name: p.name, price: p.price || 0,
        sort_order: p.sortOrder || 0, is_active: true,
      }).select('id').single();
      if (!pe && pd) {
        await sbClient.from('inventory').insert({
          tenant_id: TENANT_ID, product_id: pd.id,
          current_stock: typeof p.stock === 'number' ? p.stock : 0,
          ideal_stock: p.minStock || 0,
          monthly_consumption: p.monthlyConsumption || 0,
          seasonal_factor: p.seasonalFactor || 1.0,
          avg_order_quantity: 0,
        });
      }
      done++;
      showToast(`移行中...${done}/${total}件`);
    }

    await loadDataFromSupabase();
    render();
    showToast('移行完了！');
  } catch(e) {
    console.error('移行エラー:', e);
    showToast('移行エラー: ' + (e.message || ''));
  }
}
