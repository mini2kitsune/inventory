<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>CDN診断テスト</title>
  <style>
    body { font-family: sans-serif; background: #fff; color: #111; padding: 40px; font-size: 20px; line-height: 1.8; }
    .ok { color: green; font-weight: bold; }
    .ng { color: red; font-weight: bold; }
    .box { background: #f0f0f0; border: 2px solid #999; padding: 16px; border-radius: 8px; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>🦊 CDN 接続テスト</h1>
  <div class="box">
    <strong>Supabase CDN (cdn.jsdelivr.net):</strong><br>
    <span id="supabaseStatus" class="ng">⏳ 読み込み中...</span>
  </div>
  <div class="box">
    <strong>UNPKG CDN フォールバック:</strong><br>
    <span id="unpkgStatus">未テスト</span>
  </div>

  <script>
    function checkSupabase() {
      if (typeof window.supabase !== 'undefined') {
        document.getElementById('supabaseStatus').textContent = '✅ jsdelivr.net 接続OK';
        document.getElementById('supabaseStatus').className = 'ok';
      } else {
        document.getElementById('supabaseStatus').textContent = '❌ jsdelivr.net がブロックされています';
        document.getElementById('supabaseStatus').className = 'ng';
        // try unpkg fallback
        document.getElementById('unpkgStatus').textContent = '⏳ unpkg試行中...';
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js';
        s.onload = () => {
          document.getElementById('unpkgStatus').textContent = '✅ unpkg.com 接続OK';
          document.getElementById('unpkgStatus').className = 'ok';
        };
        s.onerror = () => {
          document.getElementById('unpkgStatus').textContent = '❌ unpkg.com もブロックされています';
          document.getElementById('unpkgStatus').className = 'ng';
        };
        document.head.appendChild(s);
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onload="checkSupabase()" onerror="checkSupabase()"></script>
  <script>setTimeout(checkSupabase, 5000);</script>
</body>
</html>
