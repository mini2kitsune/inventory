<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>診断テストページ</title>
  <style>
    body {
      font-family: sans-serif;
      background: #ffffff;
      color: #111;
      padding: 40px;
      font-size: 20px;
      line-height: 1.8;
    }
    .ok { color: green; font-weight: bold; }
    .ng { color: red; font-weight: bold; }
    .box { background: #f0f0f0; border: 2px solid #999; padding: 16px; border-radius: 8px; margin: 12px 0; }
    #jsStatus { font-size: 24px; }
  </style>
</head>
<body>
  <h1>🦊 在庫管理アプリ 診断ページ</h1>
  <div class="box">
    <strong>これが見えていますか？</strong><br>
    白い背景、黒い文字、🦊 絵文字が見えていますか？
  </div>
  <div class="box">
    <strong>JavaScript 動作確認:</strong><br>
    <span id="jsStatus" class="ng">❌ JavaScript が動いていません</span>
  </div>
  <div class="box">
    <strong>現在時刻 (JS実行時):</strong> <span id="now">未取得</span>
  </div>
  <div class="box">
    <strong>ブラウザ情報:</strong> <span id="ua">未取得</span>
  </div>
  <script>
    document.getElementById('jsStatus').textContent = '✅ JavaScript 動作OK';
    document.getElementById('jsStatus').className = 'ok';
    document.getElementById('now').textContent = new Date().toString();
    document.getElementById('ua').textContent = navigator.userAgent;
  </script>
</body>
</html>
